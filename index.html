<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Libro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --pw:340px; --ph:480px; --escala:1; --dur:1.15s;
  --tapa1:#6b2630; --tapa2:#4a1a20; --tapa3:#33111a;
  --oro:#d4b06a; --oro2:#f0d59a;
  --papel:#f3ead6; --tinta:#241b13; --tinta2:#6e5a45; --folio:#9a8664;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120d0b;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{font-family:'Cormorant Garamond',Garamond,'EB Garamond',Georgia,'Times New Roman',serif;color:var(--tinta)}
body.instantaneo #libro,body.instantaneo #libro *{transition:none !important;animation:none !important}

/* ---------- las dos capas: la sala y el lector ---------- */
#sala,#lector{position:fixed;inset:0;overflow:hidden;transition:opacity .7s ease,visibility .7s}
#sala{z-index:1}
#lector{z-index:10;opacity:0;visibility:hidden}
body.en-lector #lector{opacity:1;visibility:visible}
body.en-lector #sala{opacity:0;visibility:hidden}
body.sin-fundido #sala,body.sin-fundido #lector{transition:none}

/* ---------- la mesa del lector ---------- */
#escena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  perspective:2400px;perspective-origin:50% 45%;overflow:hidden;cursor:pointer;
  background:
    var(--tex-madera-h, none) 0 0 / 300px 300px,
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(130,95,60,.38), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.014) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 37px),
    linear-gradient(180deg,#221915 0%,#130e0b 55%,#0a0706 100%);
  background-blend-mode:multiply, normal, normal, normal, normal}

/* ---------- el libro ---------- */
#libro{position:relative;width:var(--pw);height:var(--ph);transform-style:preserve-3d;
  transition:transform var(--dur) cubic-bezier(.65,0,.35,1)}
#libro.escondido{opacity:0}
body[data-modo="2"] #libro{width:calc(var(--pw)*2)}
body[data-modo="2"] #libro.cerrado{transform:translateX(calc(var(--pw) * -0.5))}

/* papel */
.papel{background:
    var(--tex-papel, none) 0 0 / 300px 300px,
    radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.28), transparent 72%),
    repeating-linear-gradient(0deg, rgba(110,80,45,.045) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, rgba(110,80,45,.03) 0 1px, transparent 1px 7px),
    linear-gradient(180deg,#f6eedc,#ede2ca);
  background-blend-mode:multiply, normal, normal, normal, normal;
  box-shadow:inset 0 0 44px rgba(120,90,50,.16)}
.pagina{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
body[data-modo="2"] #der{left:var(--pw)}
#izq{display:none}
body[data-modo="2"] #izq{display:block}
.pagina.oculta{visibility:hidden}
/* sombra del lomo */
.lado-der::after,.lado-izq::after{content:'';position:absolute;inset:0;pointer-events:none}
.lado-der::after{background:linear-gradient(90deg, rgba(60,40,20,.30), rgba(60,40,20,.09) 6%, transparent 15%)}
.lado-izq::after{background:linear-gradient(270deg, rgba(60,40,20,.30), rgba(60,40,20,.09) 6%, transparent 15%)}
/* lienzo de efectos y tinte, detrás del texto */
.lienzo,.tinte{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* canto de las hojas (el grosor del libro) */
.canto{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);transform:translateZ(-1px);pointer-events:none}
#canto-der{box-shadow:2px 1px 0 #e9dfc8,3px 2px 0 #d3c5a6,5px 3px 0 #e9dfc8,6px 4px 0 #d3c5a6,8px 5px 0 #e2d7bd,9px 6px 0 #c9bb9b}
body[data-modo="2"] #canto-der{left:var(--pw)}
#canto-izq{display:none;box-shadow:-2px 1px 0 #e9dfc8,-3px 2px 0 #d3c5a6,-5px 3px 0 #e9dfc8,-6px 4px 0 #d3c5a6,-8px 5px 0 #e2d7bd,-9px 6px 0 #c9bb9b}
body[data-modo="2"] #libro.abierto #canto-izq{display:block}

/* tapas */
.cuero{background:
    var(--tex-cuero, none) 0 0 / 220px 220px,
    radial-gradient(ellipse at 28% 18%, rgba(255,255,255,.11), transparent 55%),
    radial-gradient(ellipse at 82% 92%, rgba(0,0,0,.38), transparent 60%),
    repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,.035) 0 2px, transparent 2px 5px),
    repeating-radial-gradient(circle at 70% 60%, rgba(255,255,255,.025) 0 1px, transparent 1px 4px),
    linear-gradient(160deg, var(--tapa1), var(--tapa2) 60%, var(--tapa3));
  background-blend-mode:multiply, normal, normal, normal, normal, normal}
#tapa,#contratapa{position:absolute;top:-7px;left:0;width:calc(var(--pw) + 7px);height:calc(var(--ph) + 14px)}
body[data-modo="2"] #tapa,body[data-modo="2"] #contratapa{left:var(--pw)}
#contratapa{transform:translateZ(-6px);border-radius:3px 10px 10px 3px;
  box-shadow:0 3px 0 -1px #1f0a0e,0 6px 0 -2px #150609,0 34px 60px rgba(0,0,0,.7)}
#tapa{transform-origin:left center;transform-style:preserve-3d;transform:rotateY(0deg) translateZ(6px);
  transition:transform var(--dur) cubic-bezier(.65,0,.35,1)}
#libro.abierto #tapa{transform:rotateY(-180deg) translateZ(6px)}
#tapa.oculta{visibility:hidden}
.cara{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cara.dorso{transform:rotateY(180deg)}
#tapa .frente{border-radius:3px 10px 10px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:12% 10%;text-align:center;
  box-shadow:0 3px 0 -1px #1f0a0e,0 6px 0 -2px #150609,0 34px 60px rgba(0,0,0,.7),inset 0 0 0 1px rgba(0,0,0,.35)}
#tapa .frente::before{content:'';position:absolute;inset:15px 15px 15px 22px;border:1.5px solid rgba(212,176,106,.72);
  outline:1px solid rgba(212,176,106,.32);outline-offset:4px;border-radius:2px 6px 6px 2px;pointer-events:none}
#tapa .frente::after{content:'';position:absolute;top:0;bottom:0;left:0;width:16px;border-radius:3px 0 0 3px;
  background:linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.08) 45%, rgba(255,255,255,.09) 65%, rgba(0,0,0,.3))}
#tapa-titulo{font-family:Cinzel,'Cormorant Garamond',serif;font-weight:600;font-size:clamp(15px, calc(var(--pw)*0.082), 42px);
  line-height:1.28;letter-spacing:.06em;margin:.55em 0 .4em;text-wrap:balance;
  background:linear-gradient(180deg,#f6e2a6 0%,#d9b463 48%,#a9822f 52%,#f0d58f 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(255,220,150,.18))}
#tapa-autor{font-style:italic;font-weight:500;color:rgba(240,213,154,.88);font-size:clamp(12px, calc(var(--pw)*0.052), 24px);letter-spacing:.03em}
.adorno{display:block;width:34%;height:auto;color:#b39a6a;margin:0 auto}
#tapa .adorno{color:var(--oro);width:40%}
#tapa .dorso{background:linear-gradient(160deg, var(--tapa2), var(--tapa3))}
#tapa .dorso::before{content:'';position:absolute;inset:9px 9px 9px 0;
  background:
    radial-gradient(ellipse 30% 20% at 20% 25%, rgba(120,70,60,.35), transparent 70%),
    radial-gradient(ellipse 25% 35% at 75% 60%, rgba(70,90,70,.30), transparent 70%),
    radial-gradient(ellipse 40% 25% at 50% 85%, rgba(140,100,60,.30), transparent 70%),
    radial-gradient(ellipse 20% 30% at 85% 15%, rgba(120,70,60,.25), transparent 70%),
    radial-gradient(ellipse 35% 20% at 35% 55%, rgba(90,70,110,.18), transparent 70%),
    repeating-linear-gradient(45deg, rgba(80,50,40,.05) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(80,50,40,.05) 0 1px, transparent 1px 6px),
    linear-gradient(180deg,#d8c8ab,#c9b797);
  box-shadow:inset 0 0 60px rgba(60,30,20,.35)}

/* hoja que gira */
.hoja{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);transform-origin:left center;
  transform-style:preserve-3d;transform:translateZ(2px) rotateY(0deg);pointer-events:none;
  transition:transform var(--dur) cubic-bezier(.6,.05,.3,1)}
body[data-modo="2"] .hoja{left:var(--pw)}
.hoja.girada{transform:translateZ(2px) rotateY(-180deg)}
.hoja.sin-transicion{transition:none}
body[data-modo="1"] .hoja .dorso{visibility:hidden}
.hoja .cara{box-shadow:0 8px 26px rgba(0,0,0,.28)}
.hoja .cara::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;
  background:linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.42) 100%)}
.hoja .dorso::before{background:linear-gradient(270deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.42) 100%)}
.hoja.animando .cara::before{animation:sombra var(--dur) ease-in-out both}
@keyframes sombra{0%{opacity:0}50%{opacity:1}100%{opacity:0}}

/* ---------- contenido de las páginas ---------- */
.contenido{position:absolute;inset:0;padding:8% 6% 10%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.contenido.blanca{background:transparent}
.texto{display:inline-block;max-width:100%;text-align:left;margin-top:1.1em}
body.centro .texto{text-align:center}
.estrofa{margin-bottom:1.15em}
.estrofa:last-child{margin-bottom:0}
.verso{font-size:calc(var(--ph) * 0.037 * var(--escala) * var(--ajuste, 1));font-weight:500;line-height:1.52;color:var(--tinta);
  padding-left:1.4em;text-indent:-1.4em}
.contenido.densa .verso{font-weight:600}
body.centro .verso{padding-left:0;text-indent:0}
.titulo-pagina{font-family:Cinzel,serif;font-weight:400;font-size:calc(var(--ph) * 0.03 * var(--escala));letter-spacing:.25em;color:var(--tinta2);margin:.8em 0 0}
.folio{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-family:Cinzel,serif;font-size:calc(var(--ph)*0.02);letter-spacing:.2em;color:var(--folio)}
.portadilla .titulo{font-family:Cinzel,serif;font-weight:400;font-size:calc(var(--ph) * 0.046 * var(--escala));letter-spacing:.04em;line-height:1.3;margin:.7em 0 .35em;color:var(--tinta);text-wrap:balance}
.portadilla .autor{font-style:italic;font-size:calc(var(--ph) * 0.036 * var(--escala));color:var(--tinta2);margin-bottom:1em}
.portadilla .dedicatoria,.fin .colofon{font-style:italic;font-size:calc(var(--ph) * 0.03 * var(--escala));color:var(--tinta2);margin:1.8em 0 0;max-width:86%;line-height:1.45}
.fin .fin-palabra{font-family:Cinzel,serif;font-size:calc(var(--ph) * 0.06);letter-spacing:.35em;margin:.6em 0 .3em;padding-left:.35em;color:var(--tinta)}
.fin .nota{position:absolute;bottom:6%;left:0;right:0;font-family:Cinzel,serif;font-size:calc(var(--ph)*0.019);letter-spacing:.18em;color:var(--folio);text-transform:uppercase}

/* aparición verso a verso */
.viva .verso,.viva .titulo-pagina{opacity:0;animation:aparecer .85s cubic-bezier(.2,.6,.3,1) forwards;
  animation-delay:calc(var(--espera, 0ms) + var(--i, 0) * 130ms)}
@keyframes aparecer{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- chrome del lector ---------- */
#barra{position:absolute;left:0;right:0;bottom:max(14px, env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:18px;
  font-family:Cinzel,serif;font-size:13px;letter-spacing:.2em;color:rgba(212,176,106,.75);opacity:0;transition:opacity .6s;pointer-events:none}
body.leyendo #barra{opacity:1;pointer-events:auto}
#barra button{background:none;border:1px solid rgba(212,176,106,.35);color:rgba(212,176,106,.85);width:38px;height:38px;border-radius:50%;
  font:400 26px/1 'Cormorant Garamond',Georgia,serif;cursor:pointer;padding:0 0 3px;transition:background .2s,border-color .2s}
#barra button:hover{background:rgba(212,176,106,.12);border-color:rgba(212,176,106,.7)}
#num{min-width:64px;text-align:center}
#pista,#pista-sala{position:fixed;left:50%;top:max(18px, env(safe-area-inset-top));transform:translateX(-50%);max-width:70vw;text-align:center;
  font-family:Cinzel,serif;font-size:12px;letter-spacing:.16em;color:rgba(240,213,154,.7);opacity:0;transition:opacity .8s;pointer-events:none;z-index:35}
#pista{position:absolute}
#pista.ver,#pista-sala.ver{opacity:1}
body.en-lector #pista-sala{opacity:0}
#pista-sala{top:10vh;text-shadow:0 1px 6px rgba(0,0,0,.8);color:rgba(240,213,154,.85);max-width:86vw}
/* volver a la sala */
#volver{position:absolute;left:max(14px, env(safe-area-inset-left));top:max(12px, env(safe-area-inset-top));z-index:30;width:40px;height:40px;border-radius:50%;
  background:rgba(18,13,11,.55);border:1px solid rgba(212,176,106,.4);color:rgba(240,213,154,.9);
  font:400 28px/1 'Cormorant Garamond',Georgia,serif;cursor:pointer;padding:0 3px 4px 0;transition:background .2s,border-color .2s}
#volver:hover{background:rgba(212,176,106,.16);border-color:rgba(212,176,106,.8)}
/* la música se oye en la sala y en el lector: un solo botón */
#musica-btn{position:fixed;right:max(14px, env(safe-area-inset-right));bottom:max(14px, env(safe-area-inset-bottom));z-index:50;width:38px;height:38px;border-radius:50%;
  background:rgba(18,13,11,.5);border:1px solid rgba(212,176,106,.35);color:rgba(212,176,106,.85);
  font:400 19px/1 'Cormorant Garamond',Georgia,serif;cursor:pointer;padding:0 0 2px;transition:opacity .4s,background .2s,border-color .2s}
#musica-btn:hover{background:rgba(212,176,106,.12);border-color:rgba(212,176,106,.7)}
#musica-btn.apagada{opacity:.35}

/* =====================================================================
   LA SALA: dos librerías, la ventana con la luna, los sillones y la mesa
   ===================================================================== */
#sala{--lib:clamp(84px, 23vw, 230px);--lw:clamp(15px, calc(var(--lib) / 8 * .86), 27px);
  --lm:clamp(50px, min(9.5vw, 11vh), 104px);background:#1a0d0a;font-family:Cinzel,serif}
/* la pared: papel vino oscuro con rombos tenues (liso, para que las cortinas plisadas resalten) */
.pared{position:absolute;left:0;right:0;top:0;height:60%;
  background:
    var(--tex-papel, none) 0 0 / 220px 220px,
    radial-gradient(ellipse 60% 55% at 50% 35%, rgba(255,150,110,.09), transparent 70%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px),
    linear-gradient(180deg,#5c141b 0%,#3f0d12 55%,#25080b 100%);
  background-blend-mode:multiply, normal, normal, normal, normal}
.pared::after{content:'';position:absolute;left:0;right:0;bottom:-3px;height:7px;background:#2b1a0f;box-shadow:0 2px 0 #4a2f1a}
.suelo{position:absolute;left:0;right:0;top:60%;bottom:0;
  background:
    var(--tex-madera-v, none) 0 0 / 260px 260px,
    repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 1px, transparent 1px 58px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 11px),
    linear-gradient(180deg,#3a2314,#24150c 60%,#170d07);
  background-blend-mode:multiply, normal, normal, normal}
.centro{position:absolute;left:var(--lib);right:var(--lib);top:0;bottom:0}
.alfombra{position:absolute;left:3%;right:3%;top:63%;bottom:2%;border-radius:8px;
  background:
    var(--tex-tejido, none) 0 0 / 56px 56px,
    repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 6px, transparent 6px 14px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.08) 0 6px, transparent 6px 14px),
    linear-gradient(180deg,#5d739a,#4a5d80 60%,#3c4c6b);
  background-blend-mode:multiply, normal, normal, normal;
  box-shadow:inset 0 0 0 5px #34446a, inset 0 0 0 7px #7688ad, 0 6px 18px rgba(0,0,0,.4)}
/* LUZ: el haz de luna que baja de la ventana y se encharca en la alfombra (screen = solo aclara) */
.luz-luna{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:min(90%, 760px);height:42%;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 46% 42% at 50% 38%, rgba(190,205,255,.22), rgba(190,205,255,.08) 50%, transparent 72%);
  mix-blend-mode:screen}
/* viñeta general y halo frío alrededor de la ventana */
#sala::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse 82% 78% at 50% 45%, transparent 58%, rgba(0,0,0,.5) 100%)}
.ventanal::before{content:'';position:absolute;inset:-28% -30%;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 42%, rgba(180,195,255,.16), transparent 62%)}
/* la ventana: un arco de noche con la luna en marco de madera, dos cortinas recogidas con lazo, cenefa y barra */
.ventanal{position:absolute;left:50%;top:5%;transform:translateX(-50%);width:min(60%, 480px);aspect-ratio:5/6;max-height:46%}
.ventana{position:absolute;inset:0;z-index:1;
  border-radius:48% 48% 6px 6px / 40% 40% 6px 6px;overflow:hidden;
  background:
    radial-gradient(circle at 20% 34%, rgba(255,255,255,.95) 0 1px, transparent 1.6px),
    radial-gradient(circle at 72% 22%, rgba(255,255,255,.85) 0 1px, transparent 1.7px),
    radial-gradient(circle at 86% 58%, rgba(255,255,255,.7) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 38% 74%, rgba(255,255,255,.6) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 57% 47%, rgba(255,255,255,.55) 0 .7px, transparent 1.3px),
    radial-gradient(circle at 12% 62%, rgba(255,255,255,.5) 0 .7px, transparent 1.3px),
    radial-gradient(ellipse at 50% 105%, #2c3572, transparent 70%),
    linear-gradient(180deg,#1a2050,#121740 60%,#0c1030);
  box-shadow:inset 0 0 0 4px #2b1b12, inset 0 0 44px rgba(0,0,0,.6), 0 0 0 7px #6a4426, 0 0 0 9px #3a2416, 0 10px 30px rgba(0,0,0,.45)}
.luna{position:absolute;left:34%;top:15%;width:26%;height:auto;filter:drop-shadow(0 0 14px rgba(241,230,198,.55))}
/* cada cortina es un panel con pliegues, recogido a media altura (forma de reloj de arena);
   el recorte va en el ::before para que la sombra del panel siga la forma */
.cortina{position:absolute;top:-4%;bottom:-9%;width:30%;z-index:2;filter:drop-shadow(0 8px 10px rgba(0,0,0,.55))}
.cortina::before{content:'';position:absolute;inset:0;
  background:
    var(--tex-terciopelo, none) 0 0 / 120px 120px,
    linear-gradient(180deg, rgba(0,0,0,.30), transparent 22%, transparent 68%, rgba(0,0,0,.38)),
    repeating-linear-gradient(90deg, #c4333e 0 5%, #7a1820 5% 10%, #a5242e 10% 17%, #d4434e 17% 21%);
  background-blend-mode:multiply, normal, normal;
  clip-path:polygon(0 0, 100% 0, 96% 14%, 80% 34%, 50% 54%, 46% 61%, 62% 76%, 86% 90%, 100% 100%, 0 100%)}
.cortina.izq{left:-17%}
.cortina.der{right:-17%;transform:scaleX(-1)}
.lazo{position:absolute;top:56%;width:19%;height:4.6%;border-radius:45%;z-index:3;
  background:linear-gradient(180deg,#f2d688,#c9a24a 45%,#8f6a22);box-shadow:0 2px 4px rgba(0,0,0,.55), inset 0 -2px 0 rgba(0,0,0,.25)}
.lazo.izq{left:-19.5%}.lazo.der{right:-19.5%}
/* la cenefa: una banda y una fila de medios discos colgando, con filo dorado */
.cenefa{position:absolute;left:-16%;right:-16%;top:-4%;height:13%;z-index:4;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));
  background:
    radial-gradient(ellipse 50% 100% at 50% 0, #8d222c 95%, rgba(0,0,0,0) 100%) 0 100% / 12.5% 46% repeat-x,
    radial-gradient(ellipse 50% 100% at 50% 0, #d1ab55 95%, rgba(0,0,0,0) 100%) 0 100% / 12.5% 52% repeat-x,
    linear-gradient(180deg,#b3363f,#8d222c) 0 0 / 100% 56% no-repeat}
.riel{position:absolute;left:-19%;right:-19%;top:-6%;height:2.4%;border-radius:6px;z-index:5;
  background:linear-gradient(180deg,#e9c973,#a37a2a 60%,#6f4f18);box-shadow:0 3px 5px rgba(0,0,0,.5)}
.riel::before,.riel::after{content:'';position:absolute;top:-80%;width:4%;aspect-ratio:1;border-radius:50%;

/* sillones: el dibujo (o la imagen de DECORACION) más una capa de tejido recortada con su silueta */
.sillon{position:absolute;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}

.libreria{position:absolute;top:2%;bottom:20%;width:var(--lib);padding:calc(var(--lib) * .07) calc(var(--lib) * .07) 0;

body.arrastrando .ranura{box-shadow:inset 0 0 0 1px rgba(240,213,154,.10)}
.ranura.destino::after{content:'';position:absolute;bottom:0;left:50%;width:var(--lw);height:90%;transform:translateX(-50%);

/* el lomo de un libro guardado */
.lomo{position:absolute;bottom:0;left:50%;width:var(--lw);height:90%;transform:translateX(-50%);z-index:2;

  background-blend-mode:multiply, normal;

  cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:center;transition:filter .2s}
.lomo::before,.lomo::after{content:'';position:absolute;left:12%;right:12%;height:1.5px;background:rgba(240,213,154,.7)}
.lomo::before{top:7%}.lomo::after{bottom:7%}
.lomo .rotulo{writing-mode:vertical-rl;text-orientation:mixed;font-family:Cinzel,serif;font-size:clamp(7px, calc(var(--lw) * .42), 10px);

.lomo .toque{position:absolute;inset:-8px -10px}
.lomo:hover{filter:brightness(1.14)}
/* la mesa y lo que hay encima */
.mesa{position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);width:min(74%, 430px);aspect-ratio:2/1.05;max-height:28%;z-index:3}
.mesa .pata{position:absolute;top:50%;left:50%;width:4%;height:50%;background:linear-gradient(90deg,#4a2b13,#6b3f1f,#4a2b13);transform-origin:50% 0;border-radius:0 0 3px 3px}
.mesa .pata.a{transform:translateX(-50%) rotate(28deg)}
.mesa .pata.b{transform:translateX(-50%) rotate(-28deg)}
.mesa .pata.c{transform:translateX(-50%);height:47%;filter:brightness(.8)}
.mesa::after{content:'';position:absolute;left:10%;right:10%;bottom:-4%;height:14%;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), transparent 70%)}
.mesa .tablero{position:absolute;left:0;right:0;top:20%;height:40%;border-radius:50%;transition:box-shadow .25s;
  background:var(--tex-madera-h, none) 0 0 / 240px 240px, radial-gradient(ellipse at 42% 35%, #a5703f, #71461f 55%, #55321a);
  background-blend-mode:multiply, normal;
  box-shadow:0 7px 0 -1px #4a2b13, 0 9px 0 -1px #2e1a0b, 0 22px 34px rgba(0,0,0,.6), inset 0 -8px 20px rgba(0,0,0,.25)}
.mesa.destino .tablero{box-shadow:0 7px 0 -1px #4a2b13, 0 9px 0 -1px #2e1a0b, 0 22px 34px rgba(0,0,0,.6), inset 0 -8px 20px rgba(0,0,0,.25), 0 0 0 3px rgba(240,213,154,.6), 0 0 24px rgba(240,213,154,.35)}

.alfombra.con-imagen{background:none;box-shadow:none;border-radius:0;left:11%;right:11%;top:62%;bottom:1%}
.alfombra .foto{display:block;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}

.piel{background:
    var(--tex-cuero, none) 0 0 / 110px 110px,

.libro-mesa{position:relative;width:var(--lm);height:calc(var(--lm) * 1.36);border-radius:2px 5px 5px 2px;cursor:pointer;touch-action:none;

  filter:drop-shadow(0 1px 0 rgba(0,0,0,.55));text-wrap:balance}
.torre{display:flex;flex-direction:column-reverse;align-items:center;gap:1px;min-width:calc(var(--lm) * 1.3)}
.libro-torre{position:relative;width:calc(var(--lm) * 1.3);height:clamp(8px, calc(var(--lm) * .15), 16px);border-radius:2px;cursor:pointer;touch-action:none;transition:filter .2s;
  background:linear-gradient(180deg, var(--c1), var(--c2) 60%, var(--c3));

.libro-torre:nth-child(odd){transform:translateX(-4%)}
.libro-torre:nth-child(even){transform:translateX(4%)}
.libro-torre:hover{filter:brightness(1.15)}
/* vuelos entre la librería y la mesa, y el libro que se arrastra */
.vuelo{position:fixed;left:0;top:0;z-index:70;pointer-events:none;border-radius:2px;

/* =====================================================================
   LOS GIRASOLES: dos lienzos (los posados se pintan una sola vez)
   ===================================================================== */
#girasoles{position:fixed;inset:0;z-index:40;background:rgba(22,13,5,.62);opacity:0;animation:capa-entra .8s ease forwards;cursor:pointer;touch-action:none}

#girasoles .aviso{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:Cinzel,serif;letter-spacing:.32em;padding-left:.32em;
  color:#fff7dc;font-size:19px;opacity:0;text-shadow:0 2px 14px rgba(0,0,0,.8), 0 0 30px rgba(0,0,0,.6);transition:opacity .8s;pointer-events:none}
#girasoles.lleno:not(.nota-visible) .aviso{opacity:1;animation:latir 1.8s ease-in-out infinite}
@keyframes latir{50%{transform:translate(-50%,-50%) scale(1.12)}}
#girasoles .nota{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(86vw, 440px);padding:28px 26px 20px;border-radius:3px;
  text-align:center;opacity:0;transition:opacity .7s,transform .7s;box-shadow:0 30px 70px rgba(0,0,0,.65), inset 0 0 0 1px rgba(120,90,50,.25);pointer-events:none}

#girasoles .nota p{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px, 5.4vw, 27px);font-style:italic;font-weight:500;line-height:1.4;color:var(--tinta);margin:.3em 0 .7em;overflow-wrap:anywhere}
#girasoles .nota .pie{display:block;font-family:Cinzel,serif;font-size:10px;letter-spacing:.18em;color:var(--folio);text-transform:uppercase}

/* pantallas angostas (celular vertical): ventana y sillones más grandes */
@media (max-width: 640px) and (orientation: portrait){

}

  :root{--dur:.3s}
  .viva .verso,.viva .titulo-pagina{animation-duration:.25s;animation-delay:0ms}
}

<script>
// Colores de cuero compartidos por el lector y la sala.
window.TAPAS = {
  burdeos:['#6b2630','#4a1a20','#33111a'], verde:['#2f5a44','#1f3f2f','#142a20'],
  azul:['#2b3f6b','#1e2c4d','#141d33'], marron:['#6b4a2b','#4a321c','#2f1f10'], negro:['#3d3d3d','#242424','#151515'],
  girasol:['#a1741f','#6e4d13','#452f0a']
};

// =====================================================================
//  EL LECTOR: el libro que se abre y pasa páginas. Vive escondido detrás
//  de la sala y la sala lo llama con LECTOR.mostrar(datos).
// =====================================================================
(function(){
  'use strict';
  const $ = s => document.querySelector(s);
  const cuerpo = document.body, libro = $('#libro'), tapa = $('#tapa'), der = $('#der'), izq = $('#izq');
  const num = $('#num'), pista = $('#pista'), escena = $('#escena');
  const q = new URLSearchParams(location.search);
  const modoForzado = q.get('modo') === '1' || q.get('modo') === '2' ? +q.get('modo') : 0;
  const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DUR = reducido ? 300 : 1150;
  document.documentElement.style.setProperty('--dur', DUR + 'ms');
  const R = Math.random;
  const raiz = document.documentElement.style;

  let modo = 1, cur = 0, abierto = false, ocupado = false, pistaT = 0, pasadas = 0, PW = 340, PH = 480;
  let L = {}, paginas = [], n = 2, titulo = 'Libro';
  const activo = () => cuerpo.classList.contains('en-lector');

  // ---- cargar un libro (los ajustes de poema.js) ----
  function cargar(datos){
    L = (datos && typeof datos === 'object') ? datos : {};
    paginas = Array.isArray(L.paginas) && L.paginas.length ? L.paginas
      : ['Todavía no hay poema.\nAbre poema.js y escribe el tuyo.'];
    n = paginas.length + 2;               // portadilla + páginas + fin

  function nuevaHoja(e, inicial, viento){
    const p = { s:(6 + R()*8)*e.k, vy:(22 + R()*30)*e.k, vx:(viento*(40 + R()*50) + (R() - .5)*10)*e.k,

  EFECTOS.estrellas = { n:42,

    extra:e => { e.fugaz = null; e.prox = 2 + R()*4; },

  class Escena {
    constructor(cv, tipo, w, h){
      this.c = cv; this.ctx = cv.getContext('2d'); this.def = EFECTOS[tipo]; this.t = R()*100; this.vivo = false; this.p = [];
      this.redim(w, h);
      const cant = Math.round(this.def.n * Math.min(2, Math.max(.6, (w*h)/(370*526))));
      for (let i = 0; i < cant; i++) this.p.push(this.def.nueva(this, true));
      if (this.def.extra) this.def.extra(this);
    }
    redim(w, h){
      const dpr = Math.min(devicePixelRatio || 1, 2);
      this.w = w; this.h = h; this.k = w/370;
      this.c.width = Math.round(w*dpr); this.c.height = Math.round(h*dpr);
      this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    frame(dt){ this.ctx.clearRect(0, 0, this.w, this.h); this.t += dt; this.def.paso(this, dt); }

    }

  }
  function lienzoDe(ef){

  }
  function arrancarEfecto(el){

  function pararEfectos(){ [der, izq].forEach(el => { if (el._efecto){ el._efecto.stop(); el._efecto = null; } }); }
  function prepararCara(cara, copia){
    const cv = cara.querySelector('canvas.lienzo'); if (!cv) return;

  // ---- páginas ----
  const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const ADORNO = '<svg class="adorno" viewBox="0 0 120 12" aria-hidden="true"><path d="M0 6h46M74 6h46" stroke="currentColor" stroke-width="1" fill="none"/><path d="M60 1l5 5-5 5-5-5z" fill="currentColor"/></svg>';

  function htmlPagina(i, viva, espera){
    if (i < 0 || i >= n) return '<div class="contenido blanca"></div>';
    if (i === 0) return '<div class="contenido portadilla' + (viva ? ' viva' : '') + '">' + ADORNO +
      '<h1 class="titulo">' + esc(titulo) + '</h1>' +
      (L.autor ? '<div class="autor">' + esc(L.autor) + '</div>' : '') + ADORNO +
      (L.dedicatoria ? '<p class="dedicatoria">' + esc(L.dedicatoria) + '</p>' : '') + '</div>';
    if (i === n - 1) return lienzoDe(L.efecto_fin) + '<div class="contenido fin">' + ADORNO + '<div class="fin-palabra">Fin</div>' +
      (L.colofon ? '<p class="colofon">' + esc(L.colofon) + '</p>' : '') +
      '<p class="nota">Toca para cerrar el libro</p></div>';
    const p = paginas[i - 1];
    const obj = p && typeof p === 'object';
    const texto = obj ? String(p.texto || '') : String(p || '');
    const tit = (obj && p.titulo) ? '<h2 class="titulo-pagina" style="--i:0">' + esc(p.titulo) + '</h2>' : '';
    let k = tit ? 1 : 0;
    const estrofas = texto.replace(/\r/g, '').trim().split(/\n[ \t]*\n+/).map(e =>
      '<div class="estrofa">' + e.split('\n').map(v =>

  // cada página ajusta su letra para que el verso más largo quepa en una línea
  const medidor = document.createElement('canvas').getContext('2d');
  function ajustarTexto(cont){
    if (!cont) return;
    const versos = cont.querySelectorAll('.verso'); if (!versos.length) return;
    cont.style.setProperty('--ajuste', 1); cont.classList.remove('densa');
    const cs = getComputedStyle(versos[0]);
    medidor.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    let max = 0;
    versos.forEach(v => { max = Math.max(max, medidor.measureText(v.textContent).width); });
    const cc = getComputedStyle(cont);
    const disp = cont.clientWidth - parseFloat(cc.paddingLeft) - parseFloat(cc.paddingRight);
    const a = disp / (max + 2);
    if (a < .999){
      cont.style.setProperty('--ajuste', Math.max(.72, a).toFixed(3));
      if (a < .9) cont.classList.add('densa');
    }
  }
  function ajustarTodo(){ document.querySelectorAll('.contenido.poema').forEach(ajustarTexto); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarTodo);

  function pintar(el, i, viva, espera){
    if (el._efecto){ el._efecto.stop(); el._efecto = null; }
    el.innerHTML = htmlPagina(i, viva, espera);

  function render(){
    if (modo === 2){
      const k = Math.ceil(cur / 2);

    } else {
      pintar(der, cur, false);
    }
    barra();
  }
  function barra(){
    if (!abierto){ num.textContent = ''; return; }
    let txt;
    if (modo === 2){
      const k = Math.ceil(cur / 2), a = 2 * k - 1, b = 2 * k;
      const en = i => i >= 1 && i <= n - 2;
      if (en(a) && en(b)) txt = a + '–' + b;
      else if (en(a)) txt = String(a);
      else if (en(b)) txt = String(b);
      else txt = (b >= n - 1 || a >= n - 1) ? 'Fin' : '';
    } else {
      txt = cur === 0 ? '' : cur === n - 1 ? 'Fin' : String(cur);
    }
    num.textContent = txt && txt !== 'Fin' ? txt + ' / ' + (n - 2) : txt;
  }

  // ---- medidas: una hoja (celular vertical) o dos (pantalla ancha) ----
  function medir(){
    const W = innerWidth, H = innerHeight, RZ = 1.42;
    const nuevo = modoForzado || ((W >= 760 && W > H * 1.05) ? 2 : 1);
    let pw, ph;
    if (nuevo === 1){
      pw = Math.min(W * 0.9, 440); ph = pw * RZ;
      const maxH = H * 0.8; if (ph > maxH){ ph = maxH; pw = ph / RZ; }
    } else {
      ph = Math.min(H * 0.82, 760); pw = ph / RZ;
      const maxW = W * 0.92; if (pw * 2 > maxW){ pw = maxW / 2; ph = pw * RZ; }
    }
    PW = pw; PH = ph;
    raiz.setProperty('--pw', pw.toFixed(1) + 'px');
    raiz.setProperty('--ph', ph.toFixed(1) + 'px');
    if (nuevo !== modo){
      modo = nuevo; cuerpo.dataset.modo = modo;
      cuerpo.classList.add('instantaneo');
      document.querySelectorAll('.hoja').forEach(h => h.remove());
      tapa.classList.toggle('oculta', abierto && modo === 1);
      render();
      requestAnimationFrame(() => requestAnimationFrame(() => cuerpo.classList.remove('instantaneo')));
    } else {
      ajustarTodo();
      [der, izq].forEach(el => { if (el._efecto) el._efecto.redim(PW, PH); });
    }
  }

  // ---- animaciones ----
  function esperar(el, cb){
    let hecho = false;
    const fin = () => { if (hecho) return; hecho = true; el.removeEventListener('transitionend', onEnd); cb(); };
    const onEnd = e => { if (e.target === el && e.propertyName === 'transform') fin(); };
    el.addEventListener('transitionend', onEnd);
    setTimeout(fin, DUR + 120);
  }
  function crearHoja(iFrente, iDorso, girada, copiaFrente, copiaDorso){
    const h = document.createElement('div');
    h.className = 'hoja' + (girada ? ' girada sin-transicion' : ' sin-transicion');
    h.innerHTML = '<div class="cara frente papel lado-der">' + htmlPagina(iFrente, false) + '</div>' +
                  '<div class="cara dorso papel lado-izq">' + htmlPagina(iDorso, false) + '</div>';
    libro.appendChild(h);
    h.querySelectorAll('.contenido.poema').forEach(ajustarTexto);
    prepararCara(h.querySelector('.frente'), copiaFrente);
    prepararCara(h.querySelector('.dorso'), copiaDorso);

  function girar(h, haciaAdelante, cb){
    h.getBoundingClientRect();
    h.classList.remove('sin-transicion');
    h.classList.add('animando');
    h.getBoundingClientRect();
    h.classList.toggle('girada', haciaAdelante);
    esperar(h, () => { h.remove(); cb(); });
  }
  function mostrarPista(txt, ms){

  function abrir(){
    if (ocupado || abierto) return;
    ocupado = true; abierto = true; cur = 0;
    arrancarMusica();
    render();
    pintar(der, 0, true, 650);
    tapa.classList.remove('oculta');
    libro.classList.add('abierto'); libro.classList.remove('cerrado');
    cuerpo.classList.add('leyendo');
    barra();
    mostrarPista('Toca para pasar la página · desliza a la derecha para volver', 6000);
    esperar(tapa, () => { if (modo === 1) tapa.classList.add('oculta'); ocupado = false; });
  }
  function cerrar(){
    if (ocupado || !abierto) return;
    ocupado = true; abierto = false;
    tapa.classList.remove('oculta');
    tapa.getBoundingClientRect();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      libro.classList.remove('abierto'); libro.classList.add('cerrado');
      cuerpo.classList.remove('leyendo');
      barra();
      pista.classList.remove('ver');
      esperar(tapa, () => { cur = 0; render(); ocupado = false; if (LECTOR.alCerrar) LECTOR.alCerrar(); });
    }));
  }
  function adelante(){
    if (ocupado) return;
    if (!abierto){ abrir(); return; }
    if (++pasadas === 1) pista.classList.remove('ver');
    if (modo === 2){
      const k = Math.ceil(cur / 2), sig = 2 * k + 1;
      if (sig > n - 1){ cerrar(); return; }
      ocupado = true;
      const h = crearHoja(2 * k, sig, false, der.querySelector('canvas.lienzo'), null);
      pintar(der, 2 * k + 2, true, 500);
      girar(h, true, () => { pintar(izq, sig, false); cur = sig; ocupado = false; barra(); });
    } else {
      if (cur + 1 > n - 1){ cerrar(); return; }
      ocupado = true;
      const h = crearHoja(cur, -1, false, der.querySelector('canvas.lienzo'), null);
      pintar(der, cur + 1, true, 500);
      girar(h, true, () => { cur = cur + 1; ocupado = false; barra(); });
    }
  }
  function atras(){
    if (ocupado || !abierto) return;
    if (modo === 2){
      const k = Math.ceil(cur / 2);
      if (k === 0){ cerrar(); return; }
      ocupado = true;
      const h = crearHoja(2 * k - 2, 2 * k - 1, true, null, izq.querySelector('canvas.lienzo'));
      pintar(izq, 2 * k - 3, false);
      girar(h, false, () => { pintar(der, 2 * k - 2, false); cur = 2 * k - 2; ocupado = false; barra(); });
    } else {
      if (cur === 0){ cerrar(); return; }
      ocupado = true;
      const h = crearHoja(cur - 1, -1, true, null, null);
      girar(h, false, () => { pintar(der, cur - 1, false); cur = cur - 1; ocupado = false; barra(); });
    }
  }

  // ---- entrada: toque, deslizar, teclado, botones ----
  let pd = null;
  escena.addEventListener('pointerdown', e => { if (e.button !== 0) return; pd = { x: e.clientX, y: e.clientY }; });
  escena.addEventListener('pointerup', e => {
    if (!pd) return;
    arrancarMusica();
    const dx = e.clientX - pd.x, dy = e.clientY - pd.y; pd = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.3){ if (dx < 0) adelante(); else atras(); return; }
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) return;
    if (!abierto){ abrir(); return; }
    if (e.clientX < innerWidth * 0.25) atras(); else adelante();
  });
  escena.addEventListener('pointercancel', () => { pd = null; });
  $('#atras').addEventListener('click', atras);
  $('#adelante').addEventListener('click', adelante);
  $('#volver').addEventListener('click', () => { if (LECTOR.alVolver) LECTOR.alVolver(); });
  addEventListener('keydown', e => {
    if (!activo()) return;
    arrancarMusica();
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown'){ e.preventDefault(); adelante(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'Backspace'){ e.preventDefault(); atras(); }
    else if (e.key === 'Escape'){ if (abierto) cerrar(); else if (!ocupado && LECTOR.alVolver) LECTOR.alVolver(); }
  });
  addEventListener('resize', medir);

  // ---- música de fondo: un mp3 propio en bucle sin costura (Web Audio) ----
  // Se configura en poema.js (bloque "musica") y suena en la sala y en el lector.
  const LB = (typeof LIBRO === 'object' && LIBRO) ? LIBRO : {};
  const M = (LB.musica && typeof LB.musica === 'object' && LB.musica.archivo) ? LB.musica : null;
  const btnM = $('#musica-btn');
  const VOL = (M && M.volumen != null) ? Math.max(0, Math.min(1, +M.volumen)) : 0.35;
  const CRUCE = 3;                       // segundos de solape entre una vuelta y la siguiente
  let ac = null, buf = null, gainM = null, audioEl = null, mPedida = false, mSilencio = false, mTimer = 0;
  if (M) btnM.hidden = false;
  function programar(t0){
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); s.connect(g); g.connect(gainM);
    const fin = t0 + buf.duration;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(1, t0 + CRUCE);
    g.gain.setValueAtTime(1, fin - CRUCE); g.gain.linearRampToValueAtTime(0, fin);
    s.start(t0); s.stop(fin + 0.1);
    const siguiente = fin - CRUCE;
    mTimer = setTimeout(() => programar(siguiente), Math.max(0, (siguiente - ac.currentTime - 2.5) * 1000));
  }
  function alterno(){
    audioEl = new Audio(M.archivo); audioEl.loop = true; audioEl.volume = VOL;
    audioEl.play().catch(() => {});
  }
  function iniciarMusica(){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
    if (!ac){ alterno(); return; }
    ac.resume();
    gainM = ac.createGain(); gainM.gain.value = VOL; gainM.connect(ac.destination);
    fetch(M.archivo).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(d => new Promise((ok, ko) => ac.decodeAudioData(d, ok, ko)))
      .then(b => { buf = b; programar(ac.currentTime + 0.05); })
      .catch(() => { try { ac.close(); } catch (e) {} ac = null; gainM = null; alterno(); });
  }
  function arrancarMusica(){ if (!M || mPedida) return; mPedida = true; iniciarMusica(); }
  btnM.addEventListener('click', () => {
    if (!mPedida){ arrancarMusica(); return; }
    mSilencio = !mSilencio; btnM.classList.toggle('apagada', mSilencio);
    if (gainM && ac){
      const t = ac.currentTime;
      gainM.gain.cancelScheduledValues(t); gainM.gain.setValueAtTime(gainM.gain.value, t);
      gainM.gain.linearRampToValueAtTime(mSilencio ? 0 : VOL, t + 0.6);
    }
    if (audioEl){ if (mSilencio) audioEl.pause(); else audioEl.play().catch(() => {}); }
  });
  document.addEventListener('visibilitychange', () => {
    if (ac){ if (document.hidden) ac.suspend(); else if (!mSilencio) ac.resume(); }
    if (audioEl && !mSilencio){ if (document.hidden) audioEl.pause(); else audioEl.play().catch(() => {}); }
  });

  // ---- la puerta que usa la sala ----
  function reposar(){          // el libro cerrado en la portadilla, sin animar
    cuerpo.classList.add('instantaneo');
    document.querySelectorAll('.hoja').forEach(h => h.remove());
    ocupado = false; abierto = false; cur = 0; pasadas = 0;
    libro.classList.remove('abierto'); libro.classList.add('cerrado');
    tapa.classList.remove('oculta');
    cuerpo.classList.remove('leyendo');
    pista.classList.remove('ver');
    requestAnimationFrame(() => requestAnimationFrame(() => cuerpo.classList.remove('instantaneo')));
  }
  window.LECTOR = {
    alVolver: null,            // la persona pulsó "volver" (o Esc con el libro cerrado)
    alCerrar: null,            // el libro terminó de cerrarse solo (Fin, o atrás en la portadilla)
    activo,
    estaAbierto: () => abierto,
    musica: arrancarMusica,
    rectLibro: () => tapa.getBoundingClientRect(),
    esconderLibro: si => libro.classList.toggle('escondido', !!si),
    // Prepara el libro en la mesa del lector y devuelve dónde queda la tapa (para que la sala
    // haga volar el libro hasta ahí). Con pagina >= 0 se abre directo en esa página.
    mostrar(datos, op){
      op = op || {};
      cargar(datos);
      reposar();
      medir();
      if (op.pagina >= 0){
        abierto = true; cur = Math.min(n - 1, op.pagina | 0);
        libro.classList.add('abierto'); libro.classList.remove('cerrado');
        cuerpo.classList.add('leyendo');
        if (modo === 1) tapa.classList.add('oculta');
      }
      render();
      if (!abierto) mostrarPista('Toca el libro para abrirlo', 0);
      document.title = titulo + (L.autor ? ' · ' + L.autor : '');
      return tapa.getBoundingClientRect();
    },
    ocultar(){
      pararEfectos();
      reposar();
      render();
      document.title = 'Libro';
    }
  };
  medir();
})();
</script>
<script src="texturas.js"></script>
<script src="girasoles.js"></script>
<script src="sala.js"></script>
